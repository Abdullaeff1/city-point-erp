{% extends "portal/base.html" %}
{% load i18n %}
{% block heading %}{% translate "Elanlar" %}{% endblock %}
{% block content %}
<div class="flex-col gap-3">
  {% for a in announcements %}
  <article class="cp-card p-card">
    <div class="cp-meta">{{ a.get_severity_display }} · {{ a.published_at|date:"d.m.Y" }}</div>
    <h2 class="cp-section mt-1">{{ a.title }}</h2>
    <p class="cp-body-text mt-2">{{ a.body }}</p>
  </article>
  {% endfor %}
</div>
{% endblock %}

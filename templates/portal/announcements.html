{% extends "portal/base.html" %}
{% block heading %}Rəsmi elanlar{% endblock %}
{% block content %}
<div class="space-y-4">
  {% for a in announcements %}
  <article class="bg-white rounded-xl border p-5">
    <div class="text-xs uppercase tracking-wide text-cp-blue">{{ a.get_severity_display }}</div>
    <h2 class="text-lg font-semibold text-cp-navy">{{ a.title }}</h2>
    <div class="text-xs text-slate-400 mb-2">{{ a.published_at|date:"d.m.Y" }}</div>
    <p class="text-sm">{{ a.body }}</p>
  </article>
  {% endfor %}
</div>
{% endblock %}

{% extends "erp/base.html" %}
{% load i18n %}
{% block heading %}{% translate "Rezidentlər" %}{% endblock %}
{% block content %}
<div class="cp-card" style="padding:8px 0;">
  {% for c in companies %}
  <a href="{% url 'erp:resident_detail' c.slug %}" class="cp-list-row">
    <strong>{{ c.name }}</strong>
    <span class="cp-meta">{{ c.get_status_display }}</span>
  </a>
  {% endfor %}
</div>
{% endblock %}

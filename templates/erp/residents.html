{% extends "erp/base.html" %}
{% block heading %}Rezidentlər{% endblock %}
{% block content %}
<div class="bg-white border rounded-xl divide-y">
  {% for c in companies %}
  <a class="flex justify-between px-4 py-3 hover:bg-slate-50" href="{% url 'erp:resident_detail' c.slug %}">
    <span class="font-medium text-cp-navy">{{ c.name }}</span>
    <span class="text-sm">{{ c.get_status_display }}</span>
  </a>
  {% endfor %}
</div>
{% endblock %}

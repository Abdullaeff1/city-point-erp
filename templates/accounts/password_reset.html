{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Şifrə bərpası" %} · City Point{% endblock %}
{% block body %}
<div class="login-form-wrap" style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
  <div class="cp-card login-card">
    <h2 class="cp-section">{% translate "Şifrəni unutmusunuz?" %}</h2>
    <p class="cp-meta mt-2">{% translate "E-poçtunuza bərpa linki göndəriləcək." %}</p>
    <form method="post" class="mt-6 flex-col gap-3">
      {% csrf_token %}
      <label>
        <span class="cp-meta">{% translate "E-poçt" %}</span>
        {{ form.email }}
      </label>
      <button class="cp-btn w-full mt-2" type="submit">{% translate "Link göndər" %}</button>
      <a class="cp-meta" href="{% url 'login' %}">{% translate "Girişə qayıt" %}</a>
    </form>
  </div>
</div>
{% endblock %}

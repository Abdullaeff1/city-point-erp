{% load i18n %}
{% if quick_actions %}
<nav class="erp-quick-links mb-5" aria-label="{% translate 'Tez keçidlər' %}">
  {% for action in quick_actions %}
  <a class="cp-card erp-quick-link" href="{{ action.url }}">
    <span class="erp-icon"><i data-lucide="{{ action.icon|default:'arrow-up-right' }}" aria-hidden="true"></i></span>
    <span>{{ action.label }}</span>
    <i data-lucide="chevron-right" width="15" height="15" aria-hidden="true"></i>
  </a>
  {% endfor %}
</nav>
{% endif %}

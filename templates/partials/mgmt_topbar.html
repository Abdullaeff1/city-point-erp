{% load i18n %}
<header class="cp-header cp-mgmt-header">
  <div class="cp-mgmt-header-left">
    <button
      type="button"
      class="cp-mgmt-toggle erp-menu-toggle"
      aria-controls="erp-sidebar"
      aria-expanded="true"
      title="{% translate 'Menyu' %}"
    >
      <i data-lucide="panel-left" width="18" height="18" aria-hidden="true"></i>
      <span class="sr-only">{% translate "Menyu" %}</span>
    </button>
    <div class="min-0">
      <p class="cp-meta">CITY POINT · {% translate "Rəhbərlik" %}</p>
      <h1 class="cp-title">{% block heading %}{% endblock %}{% block heading_count %}{% endblock %}</h1>
    </div>
  </div>
  <div class="cp-mgmt-header-right">
    <a class="mgmt-notif-btn" href="{% url 'erp:alerts' %}" title="{% translate 'Bildirişlər' %}">
      <i data-lucide="bell" width="18" height="18" aria-hidden="true"></i>
      {% if unread_alerts %}<span class="badge badge-muted" style="background:var(--mgmt-accent);color:#111;">{{ unread_alerts }}</span>{% endif %}
    </a>
    <form action="{% url 'set_language' %}" method="post" class="cp-lang">
      {% csrf_token %}
      <input name="next" type="hidden" value="{{ request.get_full_path }}">
      <select name="language" aria-label="{% translate 'Dil' %}" onchange="this.form.submit()">
        {% get_current_language as LANGUAGE_CODE %}
        {% get_available_languages as LANGUAGES %}
        {% for lang_code, lang_name in LANGUAGES %}
          <option value="{{ lang_code }}" {% if lang_code == LANGUAGE_CODE %}selected{% endif %}>{{ lang_code|upper }}</option>
        {% endfor %}
      </select>
    </form>
    <button
      type="button"
      class="cp-icon-btn"
      data-cp-theme-toggle
      data-label-dark="{% translate 'Qaranlıq rejim' %}"
      data-label-light="{% translate 'İşıqlı rejim' %}"
      title="{% translate 'Qaranlıq rejim' %}"
      aria-pressed="false"
    >
      <i data-lucide="moon" width="18" height="18" aria-hidden="true"></i>
    </button>
    {% include "partials/mgmt_account_menu.html" %}
  </div>
</header>

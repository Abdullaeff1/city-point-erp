{% load i18n %}
<div class="cp-topbar-actions">
  {% if nav_property %}
  <form class="cp-search-pill" method="get" action="{% url 'erp:spaces' %}" role="search">
    <i data-lucide="search" width="16" height="16" aria-hidden="true"></i>
    <input type="search" name="q" placeholder="{% translate 'Sahə, kod…' %}" aria-label="{% translate 'Axtarış' %}">
    <kbd>Ctrl K</kbd>
  </form>
  {% endif %}
  <button
    type="button"
    class="cp-icon-btn"
    data-cp-theme-toggle
    data-label-dark="{% translate 'Qaranlıq rejim' %}"
    data-label-light="{% translate 'İşıqlı rejim' %}"
    title="{% translate 'Qaranlıq rejim' %}"
    aria-pressed="false"
  >
    <i data-lucide="moon" width="18" height="18" aria-hidden="true"></i>
  </button>
  <form action="{% url 'set_language' %}" method="post" class="cp-lang">
    {% csrf_token %}
    <input name="next" type="hidden" value="{{ request.get_full_path }}">
    <select name="language" aria-label="{% translate 'Dil' %}" onchange="this.form.submit()">
      {% get_current_language as LANGUAGE_CODE %}
      {% get_available_languages as LANGUAGES %}
      {% for lang_code, lang_name in LANGUAGES %}
        <option value="{{ lang_code }}" {% if lang_code == LANGUAGE_CODE %}selected{% endif %}>{{ lang_code|upper }}</option>
      {% endfor %}
    </select>
  </form>
</div>

{% load static i18n %}
{% get_current_language as LANGUAGE_CODE %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}City Point{% endblock %}</title>
  {# Offline/LAN: fonts/icons/CSS from /static only #}
  <script>
    (function () {
      try {
        var t = localStorage.getItem("cp-theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
        if (
          localStorage.getItem("cp-mgmt-nav-collapsed") === "1" &&
          !window.matchMedia("(max-width: 900px)").matches
        ) {
          document.documentElement.classList.add("cp-mgmt-nav-preload-collapsed");
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{% static 'css/cp.css' %}">
  <link rel="stylesheet" href="{% static 'css/cp-crm.css' %}">
  <link rel="stylesheet" href="{% static 'css/cp-theme.css' %}">
  <link rel="stylesheet" href="{% static 'css/cp-erp.css' %}">
  <link rel="stylesheet" href="{% static 'css/cp-mgmt.css' %}">
  {% block extra_head %}{% endblock %}
  <script src="{% static 'vendor/lucide.min.js' %}"></script>
  <script src="{% static 'js/cp-search.js' %}"></script>
  <script defer src="{% static 'js/cp-theme.js' %}"></script>
  <script defer src="{% static 'js/cp-erp-menu.js' %}"></script>
  <script defer src="{% static 'js/cp-mgmt.js' %}"></script>
</head>
<body class="cp-body">
  {% block body %}{% endblock %}
  <script>lucide.createIcons();</script>
</body>
</html>

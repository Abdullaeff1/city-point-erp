{% load static i18n %}
{% get_current_language as LANGUAGE_CODE %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}City Point{% endblock %}</title>
  {# Offline/LAN: no Google Fonts / CDN — assets served from /static/ #}
  <link rel="stylesheet" href="{% static 'css/cp.css' %}">
  <script src="{% static 'vendor/lucide.min.js' %}"></script>
</head>
<body class="cp-body">
  {% block body %}{% endblock %}
  <script>lucide.createIcons();</script>
</body>
</html>

name: citypoint-dev

services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-citypoint}
      POSTGRES_USER: ${POSTGRES_USER:-citypoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citypoint}
    volumes:
      - citypoint_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-citypoint} -d ${POSTGRES_DB:-citypoint}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ../..
      dockerfile: bin/dev/Dockerfile
    env_file:
      - .env
    environment:
      AXTRAX_POLL_ON_START: ${AXTRAX_POLL_ON_START:-1}
      AXTRAX_BOOTSTRAP_ON_START: ${AXTRAX_BOOTSTRAP_ON_START:-1}
      AXTRAX_POLL_INTERVAL: ${AXTRAX_POLL_INTERVAL:-15}
      AXTRAX_PEOPLE_SYNC_INTERVAL: ${AXTRAX_PEOPLE_SYNC_INTERVAL:-300}
      TURNSTILE_MSSQL_HOST: ${TURNSTILE_MSSQL_HOST:-172.31.104.10}
      TURNSTILE_MSSQL_PORT: ${TURNSTILE_MSSQL_PORT:-1433}
      TURNSTILE_MSSQL_DATABASE: ${TURNSTILE_MSSQL_DATABASE:-AxTrax1}
      TURNSTILE_MSSQL_USER: ${TURNSTILE_MSSQL_USER:-ReadOnlyerp}
      TURNSTILE_MSSQL_PASSWORD: ${TURNSTILE_MSSQL_PASSWORD:-}
    ports:
      - "3001:8000"
    volumes:
      - ../..:/app
      - citypoint_media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  citypoint_pgdata:
  citypoint_media:
